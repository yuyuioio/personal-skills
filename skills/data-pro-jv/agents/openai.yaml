interface:
  display_name: "data-pro-jv"
  short_description: "光伏数据逐点按PCE与FF择优，独立筛选四项参数，首页双总结与良品率、统一列序、公式均值与分布点图"
  default_prompt: "使用 $data-pro-jv 处理本次J–V CSV，同样品同点先取最高PCE，PCE相对差小于5%时取FF最高的完整记录，再独立筛选Jsc/Voc总体CV≤0.8%、FF≤1.3%、PCE≤1.2%且距候选最大值≤2.5个百分点，保留各项并列最大值；前12列按编号、Jsc、Voc、FF、PCE、Pmax、Imax、Vmax、Rs、Rsh、Isc、日期排列并补全单位，首页放四项独立筛选和PCE同一入选集合的两份总结，两份总结均在Isc后加良品率a/b（a为各自筛选后可用点数，b按同样品同点合并重复测量后的总测试点数，含无效点；第一份分别列四项a/b，第二份列PCE的a/b），日期顺移，每个入选表底部用公式计算全部参数均值，保留原始扫描、来源和择优依据。"
